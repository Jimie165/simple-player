[package]
name = "simple-player"
version = "0.1.0"
edition = "2024"
description = "A high-performance media player built with Tauri."

[build-dependencies]
# 使用 Tauri v2 的构建工具
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 核心库
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2" # 用于打开文件对话框
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"     # 用于文件系统访问
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.5"
rusqlite = { version = "0.41", features = ["bundled"] } # SQLite 数据库
sha2 = "0.11" # 封面哈希
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
walkdir = "2.5.0"
cpal = "0.18.2"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
rustfft = "6.4"
rtrb = "0.4.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "query", "rustls", "system-proxy"] }
base64 = "0.23"
flate2 = "1"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSData", "NSGeometry"] }
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView", "NSResponder", "NSControl", "NSImage"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Media",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_FileProperties",
    "Storage_Streams", 
    "System",
]

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
