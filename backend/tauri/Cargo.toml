[package]
name = "simple-player"
version = "0.1.0"
edition = "2024"
description = "A high-performance media player built with Tauri."

[build-dependencies]
# 使用 Tauri v2 的构建工具
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 核心库
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2" # 用于打开文件对话框
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"     # 用于文件系统访问
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22.4"
url = "2.5" # 需要用来处理文件路径转 URI
rusqlite = { version = "0.32", features = ["bundled"] } # SQLite 数据库
chrono = { version = "0.4", features = ["serde"] } # 时间处理
sha2 = "0.10" # 封面哈希
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
walkdir = "2.5.0"
cpal = "0.17.3"
symphonia = { version = "0.5.5", features = ["all"] }
rodio = "0.22.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Media",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_FileProperties",
    "Storage_Streams", 
    "System",
]
